server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compresión para que cargue más rápido
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Cabeceras de seguridad y Content-Security-Policy (T14: mitigación XSS para tokens PKCE en localStorage)
  # Orígenes permitidos:
  # - script-src: bundle propio ('self'), Google reCAPTCHA y SDK de autenticación de Google
  # - style-src / font-src: estilos propios e inline de React, Google Fonts y FontAwesome CDN (cdnjs)
  # - img-src: imágenes propias, data/blob URIs, portadas de Spotify/Wikimedia/Unsplash, tiles CartoDB/OSM y QR
  # - media-src: audio propio, blobs WAV de Web Audio API (Beat It) y previews de Spotify CDN
  # - connect-src: API propia, Spotify API/Accounts, Firebase Auth/Firestore (HTTPS/WSS) y Google reCAPTCHA
  # - frame-src: embeds de Spotify, widget de Google reCAPTCHA y popups/iframes OAuth (Firebase/Google/Microsoft)
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.google.com https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' data: https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data: https://*.scdn.co https://*.spotifycdn.com; connect-src 'self' https://api.spotify.com https://accounts.spotify.com https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com https://www.google.com https://www.gstatic.com; frame-src 'self' https://open.spotify.com https://www.google.com https://recaptcha.google.com https://*.firebaseapp.com https://accounts.google.com https://login.microsoftonline.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;

  # Las peticiones del Captcha y 2FA se reenvían al servicio "api" de Docker Compose
  location /api/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Archivos con hash en el nombre: se pueden cachear por mucho tiempo
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # React Router: cualquier ruta (/perfil, /artistas...) devuelve index.html
  # para que no salga 404 al recargar la página
  location / {
    try_files $uri $uri/ /index.html;
  }
}
