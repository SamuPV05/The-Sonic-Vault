server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compresión para que cargue más rápido
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Las peticiones del Captcha se reenvían al servicio "api" de Docker Compose
  location /api/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Archivos con hash en el nombre: se pueden cachear por mucho tiempo
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # React Router: cualquier ruta (/perfil, /artistas...) devuelve index.html
  # para que no salga 404 al recargar la página
  location / {
    try_files $uri $uri/ /index.html;
  }
}
